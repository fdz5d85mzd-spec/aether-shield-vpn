[package]
name = "aether-shield-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
base64 = "0.22"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
x25519-dalek = "2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
